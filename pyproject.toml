[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-market-maker-sample"
version = "0.1.0"
description = "Dry-run-first reference market maker for Kalshi sports markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44",
  "requests>=2.32",
  "websockets>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
kalshi-mm = "kalshi_mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
